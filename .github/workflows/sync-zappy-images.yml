name: Sync Zappy Images

# Manually triggered from the Actions tab -- click "Run workflow." Runs
# on GitHub's own servers, which have full outbound internet access
# (unlike a sandboxed environment or a machine without internet), so this
# needs nothing installed or configured locally.
#
# What it does: downloads every Zappy's image from a live IPFS gateway,
# resizes it, saves it into zappy-images/ in the repo, and rewrites
# zappy_stats.json to point at those local files instead of any IPFS
# URL. After this runs once, the site never depends on an external
# gateway being up at page-load time again.
#
# Safe to re-run later too (e.g. after new Zappies mint) -- it just
# re-downloads and overwrites, only committing if something actually
# changed.

on:
  workflow_dispatch: {}
  # Uncomment to also run automatically on a schedule (e.g. to pick up
  # newly-minted Zappies without a manual trigger each time):
  # schedule:
  #   - cron: '0 6 * * 1'  # every Monday at 06:00 UTC

# Explicit, not relying on the repo's default Actions permission setting
# (which is often read-only) -- this grants just this workflow's
# auto-generated token write access to repo contents, needed for the
# final "git push" step below.
permissions:
  contents: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Download and process images
        run: python download_zappy_images.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zappy-images/ zappy_stats.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Sync self-hosted Zappy images"
          git push
