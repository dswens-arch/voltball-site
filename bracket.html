<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltball — Bracket</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #0B0D14;
    --panel: #151827;
    --panel-2: #1B1F32;
    --line: #262B40;
    --text: #E7E9F2;
    --text-dim: #8A8FA8;
    --striker: #E8FF3C;
    --mid: #7B5CFF;
    --guard: #2DE1C2;
    --qb: #FF9F40;
    --alert: #FF3D6E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 1200px 600px at 50% -10%, #1a1030 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding-bottom: 60px;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .display{ font-family:'Chakra Petch', sans-serif; font-weight:700; letter-spacing:0.01em; }

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 32px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(11,13,20,0.85); backdrop-filter: blur(10px);
    z-index:50;
  }
  .wordmark{
    display:flex; align-items:center; gap:10px; font-size:20px; color:inherit; cursor:pointer; text-decoration:none;
    position:relative; z-index:70;
    /* Same reasoning as .hamburger-btn -- without an explicit position+
       z-index, this is a normal in-flow element and gets buried behind
       the full-screen mobile menu (.nav-links, z-index:60) once it opens. */
  }
  .wordmark .bolt{ color:var(--striker); font-size:22px; filter: drop-shadow(0 0 8px rgba(232,255,60,0.6)); }
  .nav-links{ display:flex; align-items:center; gap:22px; margin-right:20px; }
  .nav-link{
    font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.03em;
    color:var(--text-dim); text-decoration:none; padding:6px 2px; border-bottom:2px solid transparent; transition: all .15s ease;
  }
  .nav-link:hover{ color:var(--text); }
  .nav-link.active{ color:var(--striker); border-color:var(--striker); }
  .nav-right{ display:flex; align-items:center; }
  .wallet-btn{
    background: var(--striker); color:#0B0D14; border:none; border-radius:6px;
    padding: 10px 20px; font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; letter-spacing:0.02em; transition: all .15s ease; white-space:nowrap;
  }
  .wallet-btn:hover{ box-shadow: 0 0 24px rgba(232,255,60,0.4); transform: translateY(-1px); }
  .wallet-btn.connected{
    background:var(--panel-2); color:var(--guard); border:1px solid var(--guard);
    display:flex; align-items:center; gap:8px; cursor:default;
  }
  .wallet-btn.connected:hover{ box-shadow:none; transform:none; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--guard); box-shadow:0 0 8px var(--guard); }

  .hamburger-btn{
    display:none; flex-direction:column; justify-content:center; gap:5px;
    width:32px; height:32px; background:none; border:none; cursor:pointer; padding:4px; flex-shrink:0;
    position:relative; z-index:70;
    /* Explicit position+z-index, higher than .nav-links (z-index:60) --
       without this, the button is a normal in-flow element and paints
       BEHIND any positioned sibling with a z-index regardless of DOM
       nesting, so once the full-screen menu opens it visually buries
       its own toggle/close button underneath itself. */
  }
  .hamburger-btn span{
    display:block; width:100%; height:2px; background:var(--text); border-radius:2px;
    transition: transform .2s ease, opacity .2s ease;
  }
  .hamburger-btn.open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
  .hamburger-btn.open span:nth-child(2){ opacity:0; }
  .hamburger-btn.open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }

  main{ max-width: 980px; margin: 0 auto; padding: 40px 24px 0; }

  .page-header{ margin-bottom: 8px; }
  .page-header h1{ font-size:26px; margin-bottom:4px; }
  .page-header .sub{ color:var(--text-dim); font-size:13px; }

  .status-pill{
    display:inline-block; font-family:'Chakra Petch',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; padding:3px 10px; border-radius:20px; margin-left:8px;
  }
  .status-pill.active{ background:rgba(45,225,194,0.12); color:var(--guard); }
  .status-pill.playoffs{ background:rgba(232,255,60,0.15); color:var(--striker); }
  .status-pill.complete{ background:rgba(123,92,255,0.12); color:#a595ff; }
  .status-pill.upcoming{ background:var(--panel-2); color:var(--text-dim); }

  #loading{ text-align:center; padding:100px 20px; color:var(--text-dim); font-size:14px; }
  #empty-state{ display:none; text-align:center; padding:100px 20px; }
  #empty-state h2{ font-size:20px; margin-bottom:8px; }
  #empty-state p{ color:var(--text-dim); font-size:14px; }
  #error-state{ display:none; text-align:center; padding:100px 20px; color:var(--alert); font-size:14px; }

  #bracket-wrap{ display:none; margin-top:36px; }

  .champion-banner{
    display:none; text-align:center; background:var(--panel); border:1px solid var(--striker);
    border-radius:14px; padding:32px 20px; margin-bottom:36px;
    box-shadow: 0 0 40px rgba(232,255,60,0.12);
  }
  .champion-banner .crown{ font-size:38px; margin-bottom:8px; }
  .champion-banner .cname{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:24px; color:var(--striker); }
  .champion-banner .clabel{ color:var(--text-dim); font-size:12px; text-transform:uppercase; letter-spacing:0.1em; margin-top:6px; }

  .round-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-dim);
    margin: 0 0 14px; display:flex; align-items:center; gap:10px;
  }
  .round-title::after{ content:''; flex:1; height:1px; background:var(--line); }

  .match-block{ display:flex; flex-direction:column; }
  .match-label{
    font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--text-dim); margin-bottom:8px;
  }

  .bracket-flow{ display:flex; align-items:stretch; gap:0; margin-bottom:40px; }
  .bracket-semis-col{ display:flex; flex-direction:column; justify-content:space-between; gap:20px; width:100%; max-width:440px; }
  .bracket-connector{ width:60px; flex-shrink:0; }
  .bracket-connector svg{ width:100%; height:100%; display:block; }
  .bracket-final-col{ flex:1; display:flex; align-items:center; max-width:420px; }
  .bracket-final-col .match-card{ width:100%; }

  .match-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  .match-card.tbd{ opacity:0.55; }
  .side{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .side:last-child{ border-bottom:none; }
  .side.winner{ background:rgba(232,255,60,0.06); }
  .side img{ width:36px; height:36px; border-radius:8px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; }
  .side-info{ flex:1; min-width:0; }
  .side-name{ font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-name.winner-text{ color:var(--striker); }
  .side-hero{ font-size:11px; color:var(--text-dim); }
  .side-score{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:16px; color:var(--text-dim); }
  .side-score.winner-text{ color:var(--striker); }
  .cpu-tag{
    font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--text-dim);
    border:1px solid var(--line); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:middle;
  }
  .you-tag{
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:9px; letter-spacing:0.04em; color:#0B0D14;
    background:var(--striker); border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:middle;
  }
  .tbd-label{ font-size:12px; color:var(--text-dim); font-style:italic; }

  .toast{
    position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-10px); opacity:0;
    background:var(--panel-2); border:1px solid var(--guard); color:var(--guard);
    padding:12px 22px; border-radius:8px; font-size:13px; font-weight:500; z-index:100;
    transition: all .3s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width: 700px){
    nav{ padding: 14px 16px; backdrop-filter: none; }
    /* backdrop-filter above is the actual fix, not cosmetic: a filter/
       backdrop-filter on an ancestor makes it the CONTAINING BLOCK for
       any position:fixed descendant per spec -- meaning .nav-links
       below was sizing itself to nav's own small bounding box instead
       of the real viewport, not rendering translucent at all. Only
       needs disabling here, at the breakpoint where .nav-links actually
       becomes position:fixed -- desktop keeps the frosted-glass header. */
    .wordmark{ font-size:16px; gap:7px; }
    .wordmark .bolt{ font-size:17px; }
    .nav-right{ flex-direction:row; align-items:center; gap:12px; }
    .hamburger-btn{ display:flex; }
    .nav-links{
      display:none; position:fixed; inset:0;
      background: var(--bg);
      flex-direction:column; align-items:flex-start; justify-content:flex-start;
      padding:90px 28px 28px; gap:0; z-index:60;
    }
    .nav-links.open{ display:flex; }
    .nav-link{
      font-size:20px; padding:16px 0; width:100%;
      border-bottom:1px solid var(--line); white-space:normal;
    }
    .wallet-btn{ font-size:12px; padding:8px 14px; }
    .wallet-btn.connected{ font-size:11px; padding:7px 12px; }
    .bracket-flow{ flex-direction:column; gap:20px; }
    .bracket-connector{ display:none; }
    .bracket-semis-col{ max-width:none; gap:16px; }
    .bracket-final-col{ max-width:none; }
  }
</style>
</head>

<script>
  function toggleMobileNav(){
    const links = document.getElementById('nav-links');
    const btn = document.getElementById('hamburger-btn');
    const isOpen = links.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    document.body.style.overflow = isOpen ? 'hidden' : '';
  }
  window.toggleMobileNav = toggleMobileNav;
</script>

<main>

};

function avatarFor(seed, size=64){
  let hash = 0;
  const s = String(seed);
  for (let i=0; i<s.length; i++){ hash = (hash * 31 + s.charCodeAt(i)) >>> 0; }
  const hueA = hash % 360;
  const hueB = (hueA + 40 + (hash % 60)) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(${hueA},70%,55%)"/><stop offset="100%" stop-color="hsl(${hueB},70%,35%)"/>
    </linearGradient></defs>
    <rect width="100" height="100" fill="#151827"/>
    <circle cx="50" cy="50" r="34" fill="url(#g)" opacity="0.9"/>
    <path d="M53 22 L34 55 L47 55 L44 78 L68 45 L54 45 Z" fill="rgba(255,255,255,0.85)"/>
  </svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}

async function supabaseGet(path){
  const url = `${SUPABASE_URL}/rest/v1/${path}`;
  const res = await fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Accept-Profile": "public",
    },
  });
  if (!res.ok) throw new Error(`Supabase read failed: ${res.status}`);
  return res.json();
}

async function signPayload(canonicalObj, humanMessage){
  const message = JSON.stringify(canonicalObj);
  const signedData = await peraWallet.signData(
    [{ data: new TextEncoder().encode(message), message: humanMessage }],
    accountAddress
  );
  return btoa(String.fromCharCode(...signedData[0]));
}

async function callFunction(url, payload){
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const result = await res.json();
  return { status: res.status, result };
}

function toast(msg, isError=false){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = isError ? 'var(--alert)' : 'var(--guard)';
  el.style.color = isError ? 'var(--alert)' : 'var(--guard)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), isError ? 4500 : 2600);
}

const TEAM_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000;
function teamCacheKey(address){ return `voltball_myteam_${GUILD_ID}_${address}`; }
function getCachedTeam(address){
  try {
    const raw = localStorage.getItem(teamCacheKey(address));
    if (!raw) return null;
    const cached = JSON.parse(raw);
    if (Date.now() - cached.cachedAt > TEAM_CACHE_TTL_MS) return null;
    return cached.team;
  } catch (err) {
    console.error("Reading team cache failed (non-fatal):", err);
    return null;
  }
}
function setCachedTeam(address, team){
  try {
    localStorage.setItem(teamCacheKey(address), JSON.stringify({ team, cachedAt: Date.now() }));
  } catch (err) {
    console.error("Writing team cache failed (non-fatal):", err);
  }
}

async function getMyTeam(){
  const guildId = GUILD_ID;
  const timestamp = Math.floor(Date.now() / 1000);
  const payload = { guild_id: guildId, timestamp };
  const signature = await signPayload({ guild_id: guildId, timestamp }, "Check your Voltball team");
  payload.address = accountAddress;
  payload.signature = signature;
  return callFunction(FN_GET_MY_TEAM, payload);
}

function fmtStatus(status){
  return { active: "In Season", playoffs: "Playoffs", complete: "Final", upcoming: "Upcoming" }[status] || status;
}

// Renders one match card. pairing may be null (round not seeded yet --
// e.g. championship before semis resolve). match may be null (seeded
// but not yet resolved this week).
function renderMatchCard(pairing, match, teamsById){
  if (!pairing){
    return `<div class="match-card tbd">
      <div class="side"><div class="tbd-label">Awaiting semifinal winners</div></div>
    </div>`;
  }

  const teamA = teamsById[pairing.team_a_id];
  const teamB = teamsById[pairing.team_b_id];
  const resolved = !!match;
  const aWon = resolved && match.winner_team_id === pairing.team_a_id;
  const bWon = resolved && match.winner_team_id === pairing.team_b_id;

  const sideHtml = (team, teamId, won, score) => {
    if (!team) return `<div class="side"><div class="tbd-label">Unknown team</div></div>`;
    const img = (team.hero_type && HERO_IMAGE[team.hero_type]) || avatarFor(teamId);
    const isYou = teamId === myTeamId;
    return `<div class="side ${won ? 'winner' : ''}">
      <img src="${img}" onerror="this.onerror=null; this.src='${avatarFor(teamId)}';" alt="">
      <div class="side-info">
        <div class="side-name ${won ? 'winner-text' : ''}">${team.team_name}${team.is_cpu ? '<span class="cpu-tag">CPU</span>' : ''}${isYou ? '<span class="you-tag">YOU</span>' : ''}</div>
        <div class="side-hero">${team.hero_type || 'No Coach'}</div>
      </div>
      ${resolved ? `<div class="side-score ${won ? 'winner-text' : ''}">${Math.round(score)}</div>` : ''}
    </div>`;
  };

  const scoreA = resolved ? (pairing.team_a_id === match.team_a_id ? match.team_a_score : match.team_b_score) : null;
  const scoreB = resolved ? (pairing.team_b_id === match.team_a_id ? match.team_a_score : match.team_b_score) : null;

  return `<div class="match-card">
    ${sideHtml(teamA, pairing.team_a_id, aWon, scoreA)}
    ${sideHtml(teamB, pairing.team_b_id, bWon, scoreB)}
  </div>`;
}

async function init(){
  try {
    const seasons = await supabaseGet(
      `voltball_seasons?guild_id=eq.${GUILD_ID}&order=created_at.desc&limit=1&select=*`
    );
    const season = seasons[0];
    currentSeason = season;

    if (!season){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('page-sub').textContent = 'No season found for this server yet.';
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    const pill = `<span class="status-pill ${season.status}">${fmtStatus(season.status)}</span>`;
    document.getElementById('page-sub').innerHTML = `${season.name || 'Voltball'} ${pill}`;

    if (season.status === 'upcoming' || season.status === 'active'){
      document.getElementById('loading').style.display = 'none';
      const weeksLeft = season.status === 'active' ? Math.max(0, season.week_count - season.current_week + 1) : season.week_count;
      document.getElementById('empty-detail').textContent =
        season.status === 'active'
          ? `Regular season in progress — Week ${season.current_week} of ${season.week_count}. The bracket seeds once the last regular-season week resolves.`
          : `The top 4 teams get seeded into semifinals once the ${season.week_count}-week regular season wraps up.`;
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    // status is 'playoffs' or 'complete' -- semis are always week_count+1, final is week_count+2.
    const semisWeek = season.week_count + 1;
    const finalWeek = season.week_count + 2;

    const [schedule, matches, teams] = await Promise.all([
      supabaseGet(`voltball_schedule?season_id=eq.${season.id}&is_playoff=eq.true&select=*`),
      supabaseGet(`voltball_matches?season_id=eq.${season.id}&is_playoff=eq.true&select=*`),
      supabaseGet(`voltball_teams_public?season_id=eq.${season.id}&select=*`),
    ]);

    document.getElementById('loading').style.display = 'none';

    const teamsById = {};
    for (const t of teams) teamsById[t.id] = t;

    const semisPairings = schedule.filter(s => s.week_number === semisWeek);
    const finalPairing = schedule.find(s => s.week_number === finalWeek) || null;
    const semisMatches = matches.filter(m => m.week_number === semisWeek);
    const finalMatch = matches.find(m => m.week_number === finalWeek) || null;

    if (semisPairings.length === 0){
      // Playoffs status flipped but the bracket-seeding step hasn't
      // landed yet (race between status update and schedule write) --
      // treat this the same as "not started" rather than show a blank page.
      document.getElementById('empty-detail').textContent = "The bracket is being seeded — check back in a moment.";
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    document.getElementById('page-title').textContent = season.status === 'complete' ? 'Playoff Bracket — Final' : `Playoff Bracket — Week ${season.current_week}`;

    const semisGrid = document.getElementById('semis-col');
    semisGrid.innerHTML = semisPairings.map((pairing, i) => {
      const match = semisMatches.find(m =>
        (m.team_a_id === pairing.team_a_id && m.team_b_id === pairing.team_b_id) ||
        (m.team_a_id === pairing.team_b_id && m.team_b_id === pairing.team_a_id)
      ) || null;
      return `<div class="match-block"><div class="match-label">Semifinal ${i + 1}</div>${renderMatchCard(pairing, match, teamsById)}</div>`;
    }).join('');

    const finalGrid = document.getElementById('final-col');
    finalGrid.innerHTML = `<div class="match-block"><div class="match-label">Championship</div>${renderMatchCard(finalPairing, finalMatch, teamsById)}</div>`;

    if (finalMatch){
      const championTeam = teamsById[finalMatch.winner_team_id];
      if (championTeam){
        document.getElementById('champion-name').textContent = championTeam.team_name;
        document.getElementById('champion-banner').style.display = 'block';
      }
    }

    document.getElementById('bracket-wrap').style.display = 'block';
  } catch (err) {
    console.error(err);
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error-state');
    el.textContent = "Couldn't load the bracket — see console for details.";
    el.style.display = 'block';
  }
}

const seasonLoadPromise = init();

window.connectWallet = async function(){
  const btn = document.getElementById('wallet-btn');
  btn.textContent = "Connecting…";
  btn.disabled = true;
  try {
    const accounts = await peraWallet.connect();
    accountAddress = accounts[0];
    peraWallet.connector?.on("disconnect", () => location.reload());
    btn.innerHTML = `<span class="dot"></span> ${accountAddress.slice(0,6)}…${accountAddress.slice(-4)}`;
    btn.classList.add('connected');
    btn.disabled = false;
    resolveAndHighlightMyTeam();
  } catch (err) {
    btn.textContent = "Connect Wallet";
    btn.disabled = false;
    if (err?.data?.type !== "CONNECT_MODAL_CLOSED") toast("Wallet connect failed — see console.", true);
    console.error(err);
  }
};

async function resolveAndHighlightMyTeam(){
  await seasonLoadPromise;
  if (!currentSeason) return;

  let team = getCachedTeam(accountAddress);
  if (team && team.season_id !== currentSeason.id){
    team = null;
  }

  if (!team){
    try {
      const { status, result } = await getMyTeam();
      if (status === 200 && result.team){
        team = result.team;
        setCachedTeam(accountAddress, team);
      }
    } catch (err) {
      console.error(err);
      return;
    }
  }

  if (!team) return;
  myTeamId = team.id;
  // Re-render is the simplest way to apply the highlight after the
  // fact -- the bracket is small (at most 3 cards), so a full re-run
  // of init() is cheap and avoids maintaining a second code path just
  // to patch classes onto already-rendered cards.
  init();
}

peraWallet.reconnectSession().then(async (accounts) => {
  if (accounts.length){
    accountAddress = accounts[0];
    peraWallet.connector?.on("disconnect", () => location.reload());
    const btn = document.getElementById('wallet-btn');
    btn.innerHTML = `<span class="dot"></span> ${accountAddress.slice(0,6)}…${accountAddress.slice(-4)}`;
    btn.classList.add('connected');
    resolveAndHighlightMyTeam();
  }
}).catch(() => {});
</script>
